plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}
rootProject.name = "ReptileDB"
include ':app'
include ':feature'
include ':feature:main'
include ':feature:home'
include ':feature:home:data'
include ':feature:home:domain'
include ':feature:home:presentation'
include ':feature:main:data'
include ':feature:main:domain'
include ':feature:main:presentation'
include ':core'
include ':common'
include ':core:data'
include ':core:domain'
include ':core:presentation'
include ':feature:reptileDetails'
include ':feature:reptileDetails:data'
include ':feature:reptileDetails:domain'
include ':feature:reptileDetails:presentation'
include ':feature:search'
include ':feature:search:data'
include ':feature:search:domain'
include ':feature:search:presentation'
include ':imageViewer'
include ':feature:team'
include ':feature:team:data'
include ':feature:team:domain'
include ':feature:team:presentation'
include ':feature:faq'
include ':feature:faq:data'
include ':feature:faq:domain'
include ':feature:faq:presentation'
include ':feature:herpetogallery'
include ':feature:herpetogallery:data'
include ':feature:herpetogallery:domain'
include ':feature:herpetogallery:presentation'
